version: 2
updates:
  # Python. The project is managed with Pipenv (Pipfile / Pipfile.lock) and
  # also commits a pipenv-exported requirements.txt. Dependabot prefers the
  # Pipfile when both are present and regenerates the matching requirements.txt,
  # so a single entry at the root keeps both in sync.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Keep the actions in .github/workflows/ up to date. This is also what
  # maintains the pinned commit SHAs (the `# vX.Y.Z` comments) in those files.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
