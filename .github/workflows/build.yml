name: Build

# The one build recipe: CI and the release both call this. It is a reusable
# workflow so the matrix (and its Windows/UPX quirks) lives in exactly one
# place, and the release cannot silently drift from what CI validated.
on:
  workflow_call:
    inputs:
      cache:
        description: Enable the pipenv dependency cache. Disable it when the caller publishes artifacts.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: shortcircuit.exe
          - os: macos-latest
            arch: universal2
            artifact: shortcircuit-universal2.app.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache when the caller publishes the artifacts: a dependency cache
      # another workflow can write is one it could poison into a release
      # (zizmor's cache-poisoning audit).
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ${{ inputs.cache && 'pipenv' || '' }}

      - name: Download UPX [windows]
        if: matrix.os == 'windows-latest'
        run: curl -L -o upx-4.2.1-win64.zip https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-win64.zip

      - name: Extract UPX [windows]
        if: matrix.os == 'windows-latest'
        run: |
          7z x upx-4.2.1-win64.zip
          copy upx-4.2.1-win64\upx.exe upx.exe

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipenv
          python -m pipenv install --dev

      - name: Test
        run: python -m pipenv run pytest

      - name: Build [windows]
        if: matrix.os == 'windows-latest'
        run: python -m pipenv run build_win_installer.bat

      - name: Build [macos]
        if: startsWith(matrix.os, 'macos')
        run: python -m pipenv run ./build_mac_installer.sh ${{ matrix.arch }}

      # The build script always writes shortcircuit.app.tar.gz; name it after
      # the architecture it holds so the release asset says what it is.
      - name: Name the macOS artifact by architecture
        if: startsWith(matrix.os, 'macos')
        run: mv dist/shortcircuit.app.tar.gz "dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
