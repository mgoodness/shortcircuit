name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    # Pinned actionlint cannot parse GitHub's newer `$/` self-repository form
    # (actionlint 1.7.12); keep the older `./` form it does -- GitHub accepts
    # both. Revisit once actionlint understands `$/`.
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    with:
      cache: true
