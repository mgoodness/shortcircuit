name: Release

# release-please creates the tag and a *draft* GitHub release; that tag push
# lands here, which builds the binaries, attaches them to the draft, and then
# publishes it. The draft-first order is what lets immutable releases be turned
# on: a release that is already published can no longer have assets added.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Same build recipe as CI, but without the dependency cache -- this run
  # publishes the artifacts.
  build:
    name: Build
    uses: $/.github/workflows/build.yml
    with:
      cache: false

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Attach assets and publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout, so gh cannot infer the repository from a
          # git remote; point it at this one explicitly.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false
